- name: "Execute the Alive-Check commands"
  become: true
  ansible.builtin.shell:
    cmd: |
        echo "I'm alive!"
        echo "Username with become enabled: $(id -un)"
        echo "Group with become enabled:    $(id -gn)"
  args:
    executable: /bin/bash
  register: alive_check_result_get_my_id
  changed_when: false

- name: "Show the output of the Alive-Check commands"
  ansible.builtin.debug:
    var: alive_check_result_get_my_id.stdout_lines
